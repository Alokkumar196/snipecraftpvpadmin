<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07050D">
<title>SnipeCraft Admin | Sign In</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230D0817'/%3E%3Crect x='6' y='6' width='20' height='20' rx='3' fill='%237C3AED'/%3E%3Crect x='11' y='11' width='10' height='10' rx='2' fill='%23C084FC'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="admin-auth-body">

<main class="auth-shell">
  <section class="auth-card" aria-labelledby="loginTitle">
    <div class="auth-brand">
      <span class="auth-brand__mark" aria-hidden="true"></span>
      <span class="auth-brand__name">SNIPECRAFT</span>
      <span class="auth-brand__tag">Admin Panel</span>
    </div>

    <p class="auth-eyebrow">Restricted Area</p>
    <h1 class="auth-title" id="loginTitle">Sign In</h1>
    <p class="auth-sub">Authenticate with your staff credentials.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required placeholder="admin@snipecraft.gg" spellcheck="false">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>

      <p id="loginError" class="field__error" role="alert" aria-live="polite"></p>

      <button id="loginBtn" class="btn btn--primary btn--lg btn--block" type="submit">
        <span class="btn__spinner" aria-hidden="true"></span>
        <span class="btn__label">Sign In</span>
      </button>
    </form>

    <p class="auth-foot">© SnipeCraft — Admin access only</p>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
